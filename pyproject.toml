[project]
name = "lossbench"
version = "0.1.0"
description = "Expected-loss evaluation and control for agentic back-office systems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "duckdb>=1.5.5",
    "openai>=3.0.0",
    "click>=8.4.2",
    "netcal>=1.4.0",
    "scikit-learn>=1.9.0",
    "opentelemetry-api>=1.44.0",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.44.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lossbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

